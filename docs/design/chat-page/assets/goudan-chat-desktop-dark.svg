  <g transform="translate(330 116)"><circle cx="16" cy="16" r="16" fill="#F5F7F8"/><text x="11" y="21" class="btn" style="font-size:11px">苟</text><text x="44" y="14" class="n" style="font-weight:700">苟蛋</text><text x="44" y="32" class="s">10:24</text><text x="44" y="61" class="b">先不急着把摄影变成计划。你愿意停下来看一眼，</text><text x="44" y="83" class="b">本身就是一个很好的开始。</text></g>
  <g transform="translate(664 234)"><rect width="338" height="70" rx="6" fill="#1E2025"/><text x="16" y="28" class="b">我想试试用手机拍照，但不想</text><text x="16" y="49" class="b">一开始就定很难的计划。</text><text x="16" y="63" class="s">你 · 10:25</text></g>
  <g transform="translate(330 334)"><circle cx="16" cy="16" r="16" fill="#F5F7F8"/><text x="11" y="21" class="btn" style="font-size:11px">苟</text><text x="44" y="14" class="n" style="font-weight:700">苟蛋</text><text x="44" y="32" class="s">10:25 · 计划草稿已生成</text><text x="44" y="61" class="b">我把它写成了一次轻量尝试。你现在可以在卡片里直接修改。</text>
    <g transform="translate(44 85)"><rect width="620" height="320" rx="6" fill="#181A1E" stroke="#4A5235"/><rect width="620" height="40" rx="6" fill="#20251B"/><text x="18" y="25" class="lime">待你确认 · 正在编辑</text><text x="18" y="70" class="h" style="font-size:16px">用手机摄影重新感受周末</text><text x="18" y="91" class="s">确认后，计划会写入“规划”</text>
      <text x="18" y="121" class="s" style="font-weight:700">目标</text><rect x="18" y="130" width="584" height="36" rx="5" fill="#101114" stroke="#687C36"/><text x="30" y="154" class="b">不买设备，用三次散步建立观察习惯</text>
      <text x="18" y="194" class="s" style="font-weight:700">步骤</text><rect x="18" y="203" width="584" height="36" rx="5" fill="#202226"/><text x="31" y="226" class="b">1　选一个熟悉街区，只拍有光的地方</text><rect x="18" y="247" width="584" height="36" rx="5" fill="#202226"/><text x="31" y="270" class="b">2　挑一张照片，说说它让你停下的原因</text>
      <rect x="18" y="295" width="100" height="36" rx="5" fill="#D9FF5A"/><text x="40" y="318" class="btn">保存修改</text><text x="140" y="318" class="lime">取消</text><text x="538" y="318" class="lime">重生成</text>
    </g>
  </g>
