<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">苟蛋聊天页，方案 B 深色桌面设计稿</title>
  <desc id="desc">石墨深色高对比工作台，包含白色品牌线稿、对话、内联编辑计划和统一规划页面入口。</desc>
  <defs><style>
    .m{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#A7ABB4;font-size:12px}.s{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#8B919C;font-size:11px}.h{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#F5F7F8;font-size:17px;font-weight:700}.b{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#D9DDE3;font-size:14px}.n{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#D9DDE3;font-size:13px}.lime{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#D9FF5A;font-size:12px;font-weight:700}.btn{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#101114;font-size:13px;font-weight:700}
