name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-service:
    name: Agent-service (lint + format + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff format check
        run: uv run ruff format --check app tests

      - name: Mypy
        run: uv run mypy app

      # Tests need a live Supabase Postgres (asyncpg to 127.0.0.1:54322). The repo's
      # unit tests are integration-heavy; uncomment once a test DB is provisioned.
      # - name: Pytest
      #   run: uv run pytest tests/ -q

  web:
    name: Web (lint + typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
