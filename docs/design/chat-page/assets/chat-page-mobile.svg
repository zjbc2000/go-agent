<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">兴趣陪伴与规划助手聊天页，390 像素移动端设计稿</title>
  <desc id="desc">单列聊天页，包含流式对话、待确认兴趣计划、固定输入区与底部导航。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#17201D" flood-opacity=".08"/></filter>
    <style>
      .ui { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #17201D; }
      .meta { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #62706A; font-size: 11px; }
      .small { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #62706A; font-size: 10px; }
      .label { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #0B5D57; font-size: 11px; font-weight: 700; }
      .title { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #17201D; font-size: 15px; font-weight: 700; }
      .body { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #28332E; font-size: 13px; }
      .button { font-family: Inter, PingFang SC, Microsoft YaHei, sans-serif; fill: #FFFFFF; font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect width="390" height="844" fill="#F5F7F6"/>
  <rect x="0" y="0" width="390" height="72" fill="#FFFFFF"/>
  <line x1="0" y1="72" x2="390" y2="72" stroke="#D9E2DE"/>
  <rect x="16" y="18" width="36" height="36" rx="7" fill="#FFFFFF" stroke="#D9E2DE"/>
  <path d="M27 29h14M27 35h14M27 41h14" stroke="#38453F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="72" y="31" class="title">重新找回生活节奏</text>
  <circle cx="72" cy="48" r="3" fill="#0F766E"/>
  <text x="81" y="52" class="small">已保存</text>
  <rect x="338" y="18" width="36" height="36" rx="7" fill="#FFFFFF" stroke="#D9E2DE"/>
  <path d="M351 30h10M351 36h10M351 42h10" stroke="#38453F" stroke-width="1.5" stroke-linecap="round"/>

  <g transform="translate(16 96)">
    <circle cx="14" cy="14" r="14" fill="#D8EEE9"/>
    <path d="M9 18c4-8 10-7 12-8-1 7-4 11-10 11-1 0-2-1-3-2l1-1Z" fill="#0F766E"/>
    <text x="38" y="12" class="label">兴趣助手 · 正在生成计划</text>
    <text x="38" y="32" class="body">不用急着变成“会摄影的人”。</text>
    <text x="38" y="51" class="body">我们先找一个愿意出门的理由。</text>
  </g>

  <g transform="translate(94 168)">
    <rect width="280" height="58" rx="10" fill="#EEF3F1"/>
    <text x="16" y="25" class="body">我想试试用手机拍照，但不想</text>
    <text x="16" y="43" class="body">一开始就定很难的计划。</text>
    <text x="16" y="55" class="small">你 · 10:25</text>
  </g>

  <g transform="translate(16 252)">
    <circle cx="14" cy="14" r="14" fill="#D8EEE9"/>
    <path d="M9 18c4-8 10-7 12-8-1 7-4 11-10 11-1 0-2-1-3-2l1-1Z" fill="#0F766E"/>
    <text x="38" y="12" class="label">兴趣助手</text>
    <text x="38" y="32" class="body">我整理了一份可以随时调整的草稿。</text>
  </g>

  <g transform="translate(16 308)" filter="url(#shadow)">
    <rect width="358" height="269" rx="8" fill="#FFFFFF" stroke="#D1DFDA"/>
    <rect width="358" height="38" rx="8" fill="#F2F8F6"/>
    <path d="M17 19l4 4 7-9" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="24" class="label">待你确认 · 兴趣与任务草稿</text>
    <text x="16" y="66" class="title">用手机摄影重新感受周末</text>
    <text x="16" y="88" class="meta">3 次 20 分钟散步，不买设备</text>
    <line x1="16" y1="106" x2="342" y2="106" stroke="#E1E9E5"/>
    <circle cx="28" cy="132" r="8" fill="#D8EEE9"/><text x="25" y="136" class="label" style="font-size:10px;">1</text>
    <text x="47" y="137" class="body">在熟悉街区拍“有光的地方”</text>
    <circle cx="28" cy="163" r="8" fill="#D8EEE9"/><text x="25" y="167" class="label" style="font-size:10px;">2</text>
    <text x="47" y="168" class="body">挑一张照片，说说停下的原因</text>
    <text x="16" y="198" class="small">还有 1 个步骤</text>
    <path d="M334 194l4 4 4-4" fill="none" stroke="#0B5D57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="217" width="121" height="36" rx="6" fill="#0F766E"/>
    <text x="43" y="240" class="button">确认计划</text>
    <text x="164" y="240" class="label">编辑</text>
    <text x="213" y="240" class="label">重生成</text>
    <circle cx="323" cy="235" r="2" fill="#62706A"/><circle cx="331" cy="235" r="2" fill="#62706A"/><circle cx="339" cy="235" r="2" fill="#62706A"/>
  </g>

  <!-- composer and bottom nav -->
  <rect x="0" y="648" width="390" height="116" fill="#FFFFFF"/>
  <line x1="0" y1="648" x2="390" y2="648" stroke="#D9E2DE"/>
  <rect x="16" y="663" width="302" height="52" rx="8" fill="#F5F7F6" stroke="#D9E2DE"/>
  <text x="30" y="693" class="meta">继续说说你的感受…</text>
  <rect x="326" y="663" width="48" height="52" rx="8" fill="#0F766E"/>
  <path d="m341 687 17-8-8 17-3-6-6-3Z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="0" y1="764" x2="390" y2="764" stroke="#D9E2DE"/>
  <path d="M64 788h14a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H70l-6 5v-5a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4Z" fill="none" stroke="#0F766E" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="61" y="827" class="label">聊天</text>
  <path d="M186 787h18v18h-18zM190 792h10M190 797h10" fill="none" stroke="#62706A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="184" y="827" class="small">文档</text>
  <circle cx="326" cy="796" r="10" fill="none" stroke="#62706A" stroke-width="1.5"/>
  <path d="M316 811c2-7 18-7 20 0" fill="none" stroke="#62706A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="322" y="827" class="small">我</text>
</svg>
