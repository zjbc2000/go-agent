[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-service"
version = "0.1.0"
description = "FastAPI agent service: user-scoped encrypted chat backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
    "cryptography>=42",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.31.0",
    "aio-pika>=9.4",
    "jsonschema>=4.23",
    "langgraph>=0.6,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.10",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["app"]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
