<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">苟蛋聊天页，方案 A 浅色桌面设计稿</title>
  <desc id="desc">冷白高对比的四列工作台，包含品牌线稿、会话列表、流式对话、内联编辑的计划草稿和规划栏。</desc>
  <defs>
    <style>
      .m{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#6A707C;font-size:12px}.s{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#6A707C;font-size:11px}.h{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#111214;font-size:17px;font-weight:700}.b{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#25282D;font-size:14px}.n{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#343840;font-size:13px}.blue{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#246BFD;font-size:12px;font-weight:700}.btn{font-family:Inter,PingFang SC,Microsoft YaHei,sans-serif;fill:#FFF;font-size:13px;font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="1024" fill="#F7F7F8"/>
  <!-- Brand rail -->
  <rect width="72" height="1024" fill="#FFFFFF"/><line x1="72" y1="0" x2="72" y2="1024" stroke="#E2E4E8"/>
  <g transform="translate(16 23)" fill="none" stroke="#111214" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 16 13 5c1-4 4-6 7-2l3 4c4-1 8-1 12 0l4-4c4-3 7 0 6 4l-3 10c4 5 5 12 3 17-2 5-6 8-11 10M10 16C5 21 5 31 9 37c2 4 5 6 10 8"/><path d="M19 45c-4 3-5 8-4 12 1 4 5 5 8 2 5 4 11 4 15 0 3 3 8 2 8-3 0-5-2-9-6-11"/><circle cx="20" cy="25" r="2.7" fill="#111214"/><circle cx="35" cy="25" r="2.7" fill="#111214"/><circle cx="28" cy="32" r="2.7" fill="#111214"/><path d="M28 35v2c0 3-2 4-5 4-2 0-4-1-5-3m10-1c0 3 2 4 5 4 3 0 5-1 6-3"/>
  </g>
  <rect x="14" y="106" width="44" height="44" rx="6" fill="#111214"/><path d="M29 128h14m-7-7v14" stroke="#FFF" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="14" y="162" width="44" height="44" rx="6" fill="#EDF2FF"/><path d="M27 176h18v13H34l-7 5v-5h-1a4 4 0 0 1-4-4v-5a4 4 0 0 1 5-4Z" fill="none" stroke="#246BFD" stroke-width="1.6"/>
  <rect x="14" y="218" width="44" height="44" rx="6" fill="#FFFFFF"/><path d="M27 230h18v18H27zM31 235h10M31 240h10" fill="none" stroke="#565D67" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="36" cy="965" r="16" fill="#111214"/><text x="31" y="970" class="btn" style="font-size:12px">林</text>
  <!-- Conversation list -->
  <rect x="72" width="248" height="1024" fill="#FFFFFF"/><line x1="320" y1="0" x2="320" y2="1024" stroke="#E2E4E8"/>
  <text x="96" y="48" class="h">苟蛋</text><text x="96" y="68" class="s">陪你聊，也陪你行动</text>
  <rect x="96" y="98" width="200" height="38" rx="6" fill="#F2F3F5"/><circle cx="116" cy="117" r="5" fill="none" stroke="#6A707C" stroke-width="1.5"/><path d="m120 121 4 4" stroke="#6A707C" stroke-width="1.5"/><text x="137" y="122" class="m">搜索对话</text>
  <text x="96" y="173" class="s" style="font-weight:700">今天</text>
  <rect x="84" y="188" width="224" height="59" rx="6" fill="#EDF2FF"/><rect x="84" y="188" width="3" height="59" fill="#246BFD"/>
  <text x="100" y="213" class="n" style="font-weight:700">重新找回生活节奏</text><text x="100" y="232" class="s">刚刚 · 计划草稿 1</text>
  <text x="96" y="283" class="n">周末徒步准备</text><text x="96" y="302" class="s">昨天 · 12 条消息</text>
  <text x="96" y="347" class="n">吉他练习的开始</text><text x="96" y="366" class="s">7 月 30 日 · 8 条消息</text>
  <!-- Chat -->
  <rect x="320" width="740" height="1024" fill="#FFFFFF"/><line x1="320" y1="82" x2="1060" y2="82" stroke="#E2E4E8"/>
  <text x="356" y="35" class="s">聊天</text><text x="356" y="60" class="h">重新找回生活节奏</text><circle cx="554" cy="55" r="4" fill="#246BFD"/><text x="564" y="60" class="s">已保存</text>
  <rect x="978" y="28" width="48" height="34" rx="6" fill="#FFFFFF" stroke="#E2E4E8"/><circle cx="994" cy="45" r="2" fill="#565D67"/><circle cx="1002" cy="45" r="2" fill="#565D67"/><circle cx="1010" cy="45" r="2" fill="#565D67"/>
  <g transform="translate(374 116)"><circle cx="16" cy="16" r="16" fill="#111214"/><text x="11" y="21" class="btn" style="font-size:11px">苟</text><text x="44" y="14" class="n" style="font-weight:700">苟蛋</text><text x="44" y="32" class="s">10:24</text><text x="44" y="61" class="b">听起来你不是没有想做的事，只是想从更轻的方式开始。</text><text x="44" y="83" class="b">摄影或许不是目标，而是一种重新看见周末的方式。</text></g>
  <g transform="translate(656 234)"><rect width="330" height="70" rx="6" fill="#F0F2F5"/><text x="16" y="28" class="b">我想试试用手机拍照，但不想</text><text x="16" y="49" class="b">一开始就定很难的计划。</text><text x="16" y="63" class="s">你 · 10:25</text></g>
  <g transform="translate(374 334)"><circle cx="16" cy="16" r="16" fill="#111214"/><text x="11" y="21" class="btn" style="font-size:11px">苟</text><text x="44" y="14" class="n" style="font-weight:700">苟蛋</text><text x="44" y="32" class="s">10:25 · 正在生成计划</text><text x="44" y="61" class="b">那就先从一个不需要准备的周末开始。这份计划你可以直接改。</text>
    <g transform="translate(44 85)"><rect width="582" height="310" rx="6" fill="#FFFFFF" stroke="#C8D4F4"/><rect width="582" height="40" rx="6" fill="#EDF2FF"/><text x="18" y="25" class="blue">待你确认 · 正在编辑</text><text x="18" y="70" class="h" style="font-size:16px">用手机摄影重新感受周末</text><text x="18" y="91" class="s">确认后，计划会写入你的“规划”页面</text>
      <text x="18" y="121" class="s" style="font-weight:700">目标</text><rect x="18" y="130" width="546" height="35" rx="5" fill="#FFFFFF" stroke="#9CB8F8"/><text x="30" y="153" class="b">不买设备，用三次散步建立观察习惯</text>
      <text x="18" y="191" class="s" style="font-weight:700">步骤</text><rect x="18" y="200" width="546" height="36" rx="5" fill="#F8FAFF"/><text x="31" y="223" class="b">1　选一个熟悉街区，只拍有光的地方</text><rect x="18" y="244" width="546" height="36" rx="5" fill="#F8FAFF"/><text x="31" y="267" class="b">2　挑一张照片，说说它让你停下的原因</text>
      <rect x="18" y="293" width="98" height="36" rx="5" fill="#111214"/><text x="43" y="316" class="btn">保存修改</text><text x="137" y="316" class="blue">取消</text><text x="507" y="316" class="blue">重生成</text>
    </g>
  </g>
  <rect x="344" y="892" width="692" height="92" rx="6" fill="#FFFFFF" stroke="#C9CCD2"/><text x="366" y="925" class="b" style="fill:#7A808A">继续说说你的感受…</text><text x="366" y="962" class="s">Enter 发送　Shift + Enter 换行</text><rect x="978" y="926" width="40" height="40" rx="6" fill="#246BFD"/><path d="m990 945 16-8-7 16-3-6-6-2Z" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- Planning rail -->
  <rect x="1060" width="380" height="1024" fill="#FFFFFF"/><line x1="1060" y1="0" x2="1060" y2="1024" stroke="#E2E4E8"/>
  <text x="1092" y="48" class="h" style="font-size:16px">规划</text><text x="1092" y="69" class="s">和本次对话相关的已确认内容</text>
  <line x1="1092" y1="91" x2="1408" y2="91" stroke="#E2E4E8"/>
  <text x="1092" y="130" class="s" style="font-weight:700">兴趣</text><text x="1092" y="159" class="n" style="font-weight:700">城市摄影</text><text x="1092" y="180" class="s">探索中 · 更新于今天</text><text x="1360" y="159" class="blue">打开</text>
  <line x1="1092" y1="205" x2="1408" y2="205" stroke="#E2E4E8"/><text x="1092" y="244" class="s" style="font-weight:700">待确认</text><rect x="1092" y="262" width="287" height="43" rx="6" fill="#FFF6E8"/><text x="1108" y="289" class="n" style="fill:#7A3C00">摄影计划草稿</text><text x="1340" y="289" class="blue" style="fill:#9A4A00">1</text>
  <text x="1092" y="351" class="s" style="font-weight:700">记忆</text><text x="1092" y="381" class="n">偏好从轻量、可调整的尝试开始</text><text x="1092" y="401" class="s">已确认 · 10:25</text><line x1="1092" y1="430" x2="1408" y2="430" stroke="#E2E4E8"/><text x="1092" y="466" class="blue">查看全部规划</text>
</svg>
